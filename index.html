<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4F46E5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="英単語">
<link rel="manifest" id="manifest-placeholder">
<title>日常英会話 単語学習</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#4F46E5;--primary-light:#818CF8;--primary-dark:#3730A3;
  --success:#10B981;--danger:#EF4444;--warning:#F59E0B;
  --bg:#F8FAFC;--card:#FFFFFF;--text:#1E293B;--muted:#64748B;--border:#E2E8F0;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
/* NAV */
#app{display:flex;flex-direction:column;min-height:100vh}
nav{background:var(--primary);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
nav h1{font-size:18px;font-weight:700;flex:1}
#nav-back{display:none;background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:4px 8px}
/* BOTTOM TAB */
#tab-bar{display:flex;background:#fff;border-top:1px solid var(--border);position:fixed;bottom:0;left:0;right:0;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 6px;border:none;background:none;font-size:10px;color:var(--muted);cursor:pointer;gap:3px;transition:color .2s}
.tab-btn.active{color:var(--primary)}
.tab-btn svg{width:22px;height:22px}
/* MAIN */
main{flex:1;padding:16px;padding-bottom:80px;max-width:600px;margin:0 auto;width:100%}
/* CARDS */
.card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:16px}
/* CATEGORY CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{padding:6px 14px;border-radius:20px;border:2px solid var(--border);background:#fff;font-size:13px;cursor:pointer;transition:all .2s;font-weight:500}
.chip.active{border-color:var(--primary);background:var(--primary);color:#fff}
/* FLASHCARD */
#flashcard-area{display:none}
.fc-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;color:var(--muted)}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:16px}
.progress-fill{height:100%;background:var(--primary);border-radius:3px;transition:width .4s}
.flashcard{perspective:1000px;min-height:220px;cursor:pointer;margin-bottom:16px;user-select:none}
.fc-inner{position:relative;width:100%;height:220px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.flashcard.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.fc-front{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff}
.fc-back{background:linear-gradient(135deg,var(--success),#059669);color:#fff;transform:rotateY(180deg)}
.fc-word{font-size:32px;font-weight:700;margin-bottom:8px}
.fc-phonetic{font-size:14px;opacity:.8}
.fc-meaning{font-size:20px;font-weight:600;margin-bottom:6px}
.fc-example{font-size:13px;opacity:.85;font-style:italic}
.fc-hint{font-size:13px;opacity:.6;margin-top:8px}
.fc-actions{display:flex;gap:12px}
.btn{padding:12px 24px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;flex:1;text-align:center}
.btn-outline{background:#fff;color:var(--primary);border:2px solid var(--primary)}
.btn-primary{background:var(--primary);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:8px 16px;font-size:13px;border-radius:8px}
/* QUIZ */
#quiz-area{display:none}
.quiz-question{font-size:28px;font-weight:700;text-align:center;padding:24px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:16px;margin-bottom:20px}
.quiz-phonetic{font-size:14px;opacity:.8;margin-top:4px}
.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.quiz-opt{padding:16px 12px;border-radius:12px;border:2px solid var(--border);background:#fff;font-size:15px;font-weight:500;cursor:pointer;transition:all .2s;text-align:center;line-height:1.4}
.quiz-opt:active{transform:scale(.97)}
.quiz-opt.correct{border-color:var(--success);background:#D1FAE5;color:#065F46}
.quiz-opt.wrong{border-color:var(--danger);background:#FEE2E2;color:#991B1B}
.quiz-opt.disabled{pointer-events:none;opacity:.6}
.quiz-stats{display:flex;gap:16px;font-size:13px;color:var(--muted);justify-content:center}
.stat-badge{background:var(--bg);padding:6px 14px;border-radius:20px;font-weight:600}
/* PROGRESS PAGE */
.prog-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.prog-header h2{font-size:18px;font-weight:700}
.big-stat{text-align:center;padding:20px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));border-radius:16px;color:#fff;margin-bottom:16px}
.big-stat .num{font-size:48px;font-weight:700}
.big-stat .label{font-size:14px;opacity:.8}
.cat-progress{margin-bottom:12px}
.cat-progress-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.word-badge{padding:8px 12px;background:var(--bg);border-radius:8px;font-size:13px;border-left:3px solid var(--success)}
.word-badge.not-learned{border-left-color:var(--border)}
/* HOME */
.mode-card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:16px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:transform .15s,box-shadow .15s;border:2px solid transparent}
.mode-card:active{transform:scale(.98);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.mode-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.mode-title{font-size:17px;font-weight:700;margin-bottom:2px}
.mode-desc{font-size:13px;color:var(--muted)}
.summary-row{display:flex;gap:12px;margin-bottom:16px}
.summary-box{flex:1;background:var(--card);border-radius:12px;padding:14px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.summary-box .val{font-size:24px;font-weight:700;color:var(--primary)}
.summary-box .lbl{font-size:11px;color:var(--muted);margin-top:2px}
/* RESULT */
#result-area{display:none;text-align:center;padding:24px}
.result-icon{font-size:64px;margin-bottom:16px}
.result-score{font-size:48px;font-weight:700;color:var(--primary)}
/* LEVEL FILTER */
.filter-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;margin-top:4px}
.chip-level{border-color:#F59E0B}
.chip-level.active{border-color:#F59E0B;background:#F59E0B;color:#fff}
.fc-level-badge{display:inline-block;background:rgba(255,255,255,.25);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;margin-top:6px}
/* TOAST */
#toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-20px);background:#1E293B;color:#fff;padding:10px 20px;border-radius:24px;font-size:14px;opacity:0;transition:all .3s;z-index:200;white-space:nowrap;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <nav>
    <button id="nav-back" onclick="goBack()">&#8249;</button>
    <h1 id="nav-title">日常英会話 学習</h1>
  </nav>

  <main id="main-content">
    <!-- HOME -->
    <div id="page-home">
      <div class="summary-row">
        <div class="summary-box"><div class="val" id="home-learned">0</div><div class="lbl">覚えた単語</div></div>
        <div class="summary-box"><div class="val" id="home-total">500</div><div class="lbl">総単語数</div></div>
        <div class="summary-box"><div class="val" id="home-accuracy">-</div><div class="lbl">正答率</div></div>
      </div>
      <div class="mode-card" onclick="showPage('flashcard')">
        <div class="mode-icon" style="background:#EEF2FF">📖</div>
        <div><div class="mode-title">フラッシュカード</div><div class="mode-desc">単語をタップして意味を確認</div></div>
      </div>
      <div class="mode-card" onclick="showPage('quiz')">
        <div class="mode-icon" style="background:#D1FAE5">🎯</div>
        <div><div class="mode-title">4択クイズ</div><div class="mode-desc">選択肢から正解を選ぼう</div></div>
      </div>
      <div class="mode-card" onclick="showPage('progress')">
        <div class="mode-icon" style="background:#FEF3C7">📊</div>
        <div><div class="mode-title">学習進捗</div><div class="mode-desc">覚えた単語・カテゴリを確認</div></div>
      </div>
    </div>

    <!-- FLASHCARD PAGE -->
    <div id="page-flashcard" style="display:none">
      <div class="filter-label">レベル</div>
      <div class="chips" id="fc-level-chips"></div>
      <div class="filter-label">カテゴリ</div>
      <div class="chips" id="fc-chips"></div>
      <div id="flashcard-area">
        <div class="fc-meta">
          <span id="fc-category-label"></span>
          <span id="fc-counter">1 / 20</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="fc-progress"></div></div>
        <div class="flashcard" id="flashcard" onclick="flipCard()">
          <div class="fc-inner">
            <div class="fc-face fc-front">
              <div class="fc-word" id="fc-word"></div>
              <div class="fc-phonetic" id="fc-phonetic"></div>
              <div class="fc-level-badge" id="fc-level-badge"></div>
              <div class="fc-hint">タップして意味を見る</div>
            </div>
            <div class="fc-face fc-back">
              <div class="fc-meaning" id="fc-meaning"></div>
              <div class="fc-example" id="fc-example"></div>
            </div>
          </div>
        </div>
        <div class="fc-actions">
          <button class="btn btn-danger" onclick="markCard(false)">もう一度</button>
          <button class="btn btn-success" onclick="markCard(true)">覚えた！</button>
        </div>
      </div>
    </div>

    <!-- QUIZ PAGE -->
    <div id="page-quiz" style="display:none">
      <div class="filter-label">レベル</div>
      <div class="chips" id="quiz-level-chips"></div>
      <div class="filter-label">カテゴリ</div>
      <div class="chips" id="quiz-chips"></div>
      <div id="quiz-area">
        <div class="quiz-stats">
          <span class="stat-badge">✅ <span id="quiz-correct">0</span></span>
          <span class="stat-badge">❌ <span id="quiz-wrong">0</span></span>
          <span class="stat-badge">📊 <span id="quiz-acc">-%</span></span>
          <span class="stat-badge"><span id="quiz-num">1</span>/<span id="quiz-total">20</span></span>
        </div>
        <div style="height:12px"></div>
        <div class="progress-bar"><div class="progress-fill" id="quiz-progress"></div></div>
        <div class="quiz-question">
          <div id="quiz-word"></div>
          <div class="quiz-phonetic" id="quiz-phonetic"></div>
        </div>
        <div class="quiz-options" id="quiz-options"></div>
        <div id="result-area">
          <div class="result-icon">🎉</div>
          <div class="result-score" id="result-score"></div>
          <div style="color:var(--muted);margin:8px 0 24px">正解数</div>
          <button class="btn btn-primary" onclick="startQuiz()">もう一度</button>
          <div style="height:12px"></div>
          <button class="btn btn-outline" onclick="showPage('home')" style="margin-top:0">ホームへ</button>
        </div>
      </div>
    </div>

    <!-- PROGRESS PAGE -->
    <div id="page-progress" style="display:none">
      <div class="big-stat">
        <div class="num" id="prog-count">0</div>
        <div class="label">単語を覚えた！</div>
      </div>
      <div class="card">
        <h3 style="font-size:15px;font-weight:700;margin-bottom:12px">カテゴリ別進捗</h3>
        <div id="cat-progress-list"></div>
      </div>
      <div class="card">
        <div class="prog-header">
          <h2>覚えた単語</h2>
          <button class="btn btn-sm btn-outline" onclick="resetProgress()">リセット</button>
        </div>
        <div class="word-grid" id="learned-words"></div>
      </div>
    </div>
  </main>

  <div id="tab-bar">
    <button class="tab-btn active" onclick="showPage('home')" id="tab-home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      ホーム
    </button>
    <button class="tab-btn" onclick="showPage('flashcard')" id="tab-flashcard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      カード
    </button>
    <button class="tab-btn" onclick="showPage('quiz')" id="tab-quiz">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      クイズ
    </button>
    <button class="tab-btn" onclick="showPage('progress')" id="tab-progress">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      進捗
    </button>
  </div>
</div>
<div id="toast"></div>

}

// ===== STATE =====
let state = {
  learned: {},
  quizStats: {correct:0, wrong:0, total:0},
  currentPage: 'home',
  fc: {words:[], idx:0, category:'全て', level:'全て'},
  quiz: {words:[], idx:0, correct:0, wrong:0, answered:false, category:'全て', level:'全て'}
};

function loadState() {
  try {
    const s = localStorage.getItem('evAppState');
    if (s) {
      const loaded = JSON.parse(s);
      state.learned = loaded.learned || {};
      state.quizStats = loaded.quizStats || {correct:0,wrong:0,total:0};
    }
  } catch(e){}
}

function saveState() {
  localStorage.setItem('evAppState', JSON.stringify({
    learned: state.learned,
    quizStats: state.quizStats
  }));
}

// ===== UTILS =====
function getCategories(level) {
  const pool = (level && level !== '全て')
    ? VOCAB.filter(v => getWordLevel(v) === parseInt(level))
    : VOCAB;
  return ['全て', ...new Set(pool.map(v=>v.c))];
}

function getWords(category, level) {
  let words = category === '全て' ? VOCAB : VOCAB.filter(v=>v.c===category);
  if (level && level !== '全て') words = words.filter(v => getWordLevel(v) === parseInt(level));
  return words;
}

function shuffle(arr) {
  const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}

// ===== NAV =====
function showPage(page) {
  document.querySelectorAll('[id^="page-"]').forEach(el=>el.style.display='none');
  document.getElementById('page-'+page).style.display='block';
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const tab = document.getElementById('tab-'+page);
  if(tab) tab.classList.add('active');
  document.getElementById('nav-back').style.display='none';
  state.currentPage = page;
  const titles = {home:'日常英会話 学習', flashcard:'フラッシュカード', quiz:'4択クイズ', progress:'学習進捗'};
  document.getElementById('nav-title').textContent = titles[page]||'';
  if(page==='home') updateHomeStats();
  if(page==='flashcard') initFlashcard();
  if(page==='quiz') initQuiz();
  if(page==='progress') updateProgress();
}

function goBack() { showPage('home'); }

// ===== HOME =====
function updateHomeStats() {
  const learnedCount = Object.values(state.learned).filter(v=>v).length;
  document.getElementById('home-learned').textContent = learnedCount;
  document.getElementById('home-total').textContent = VOCAB.length;
  const {correct,total} = state.quizStats;
  document.getElementById('home-accuracy').textContent = total > 0 ? Math.round(correct/total*100)+'%' : '-';
}

// ===== FLASHCARD =====
function initFlashcard() {
  // Level chips
  const levelChips = document.getElementById('fc-level-chips');
  levelChips.innerHTML = '';
  ['全て','1','2','3'].forEach(l=>{
    const chip = document.createElement('button');
    chip.className='chip chip-level'+(l===state.fc.level?' active':'');
    chip.textContent = l==='全て' ? '全て' : 'Lv'+l;
    chip.onclick=()=>{ state.fc.level=l; state.fc.category='全て'; initFlashcard(); };
    levelChips.appendChild(chip);
  });
  // Category chips
  const cats = getCategories(state.fc.level);
  const chips = document.getElementById('fc-chips');
  chips.innerHTML = '';
  cats.forEach(c=>{
    const chip = document.createElement('button');
    chip.className='chip'+(c===state.fc.category?' active':'');
    chip.textContent=c;
    chip.onclick=()=>{ state.fc.category=c; initFlashcard(); };
    chips.appendChild(chip);
  });
  startFlashcard();
}

function startFlashcard() {
  const words = shuffle(getWords(state.fc.category, state.fc.level));
  if (words.length === 0) {
    document.getElementById('flashcard-area').style.display='none';
    showToast('この条件の単語はありません');
    return;
  }
  state.fc.words = words;
  state.fc.idx = 0;
  document.getElementById('flashcard-area').style.display='block';
  showFlashcard();
}

function showFlashcard() {
  const {words, idx} = state.fc;
  if(idx >= words.length) {
    showToast('🎉 このカテゴリ完了！');
    state.fc.idx = 0;
    showFlashcard();
    return;
  }
  const w = words[idx];
  document.getElementById('fc-word').textContent = w.w;
  document.getElementById('fc-phonetic').textContent = w.p;
  document.getElementById('fc-meaning').textContent = w.m;
  document.getElementById('fc-example').textContent = w.e;
  document.getElementById('fc-category-label').textContent = w.c;
  document.getElementById('fc-level-badge').textContent = 'Lv' + getWordLevel(w);
  document.getElementById('fc-counter').textContent = `${idx+1} / ${words.length}`;
  document.getElementById('fc-progress').style.width = `${(idx/words.length)*100}%`;
  const fc = document.getElementById('flashcard');
  fc.classList.remove('flipped');
}

function flipCard() {
  document.getElementById('flashcard').classList.toggle('flipped');
}

function markCard(learned) {
  const w = state.fc.words[state.fc.idx];
  if(learned) {
    state.learned[w.w] = true;
    showToast('✅ 覚えた！');
  } else {
    showToast('🔄 後でまた練習しよう');
  }
  saveState();
  state.fc.idx++;
  showFlashcard();
}

function startQuiz() {
  const words = shuffle(getWords(state.quiz.category, state.quiz.level));
  state.quiz.words = words.slice(0, Math.min(20, words.length));
  state.quiz.idx = 0;
  state.quiz.correct = 0;
  state.quiz.wrong = 0;
  document.getElementById('quiz-area').querySelector('.quiz-question').style.display='flex';
  document.getElementById('quiz-area').querySelector('.quiz-question').style.flexDirection='column';
  document.getElementById('result-area').style.display='none';
  document.getElementById('quiz-options').style.display='grid';
  document.querySelectorAll('.quiz-stats').forEach(el=>el.style.display='flex');
  updateQuizStats();
  showQuiz();
}

  document.getElementById('quiz-phonetic').textContent = w.p;
  document.getElementById('quiz-num').textContent = idx+1;
  document.getElementById('quiz-total').textContent = words.length;
  document.getElementById('quiz-progress').style.width = `${(idx/words.length)*100}%`;

  // Generate options
  const wrong = shuffle(VOCAB.filter(v=>v.m!==w.m)).slice(0,3);
  const opts = shuffle([w, ...wrong]);
  const container = document.getElementById('quiz-options');
  container.innerHTML = '';
  opts.forEach(o=>{
    const btn = document.createElement('button');
    btn.className='quiz-opt';
    btn.textContent = o.m;
    btn.onclick=()=>answerQuiz(btn, o.m===w.m, w.m, container);
    container.appendChild(btn);
  });
  state.quiz.answered = false;
}

function answerQuiz(btn, correct, correctAns, container) {
  if(state.quiz.answered) return;
  state.quiz.answered = true;
  if(correct) {
    btn.classList.add('correct');
    state.quiz.correct++;
    state.quizStats.correct++;
    showToast('✅ 正解！');
    state.learned[state.quiz.words[state.quiz.idx].w] = true;
  } else {
    btn.classList.add('wrong');
    state.quiz.wrong++;
    showToast('❌ 不正解...');
    // Show correct answer
    container.querySelectorAll('.quiz-opt').forEach(b=>{
      if(b.textContent===correctAns) b.classList.add('correct');
    });
  }
  state.quizStats.total++;
  container.querySelectorAll('.quiz-opt').forEach(b=>b.classList.add('disabled'));
  saveState();
  updateQuizStats();
  setTimeout(()=>{ state.quiz.idx++; showQuiz(); }, 1200);
}

function updateQuizStats() {
  document.getElementById('quiz-correct').textContent = state.quiz.correct;
  document.getElementById('quiz-wrong').textContent = state.quiz.wrong;
  const total = state.quiz.correct + state.quiz.wrong;
  document.getElementById('quiz-acc').textContent = total>0 ? Math.round(state.quiz.correct/total*100)+'%' : '-%';
}

function showQuizResult() {
  document.getElementById('quiz-options').style.display='none';
  document.getElementById('quiz-area').querySelector('.quiz-question').style.display='none';
  document.getElementById('result-area').style.display='block';
  const total = state.quiz.words.length;
  const score = state.quiz.correct;
  document.getElementById('result-score').textContent = `${score} / ${total}`;
  const icon = document.querySelector('.result-icon');
  if(score/total >= 0.8) icon.textContent='🎉';
  else if(score/total >= 0.5) icon.textContent='😊';
  else icon.textContent='😅';
}

// ===== PROGRESS =====
function updateProgress() {
  const learnedWords = Object.entries(state.learned).filter(([,v])=>v).map(([k])=>k);
  document.getElementById('prog-count').textContent = learnedWords.length;

  // Category progress
  const cats = getCategories().filter(c=>c!=='全て');
  const catList = document.getElementById('cat-progress-list');
  catList.innerHTML = '';
  cats.forEach(c=>{
    const total = VOCAB.filter(v=>v.c===c).length;
    const done = VOCAB.filter(v=>v.c===c && state.learned[v.w]).length;
    const pct = Math.round(done/total*100);
    const div = document.createElement('div');
    div.className='cat-progress';
    div.innerHTML=`<div class="cat-progress-label"><span>${c}</span><span>${done}/${total} (${pct}%)</span></div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;
    catList.appendChild(div);
  });

  // Learned words grid
  const grid = document.getElementById('learned-words');
  grid.innerHTML = '';
  if(learnedWords.length === 0) {
    grid.innerHTML='<p style="color:var(--muted);font-size:14px">まだ覚えた単語はありません</p>';
  } else {
    learnedWords.forEach(w=>{
      const vocab = VOCAB.find(v=>v.w===w);
      if(!vocab) return;
      const b = document.createElement('div');
      b.className='word-badge';
      b.textContent=`${w} - ${vocab.m}`;
      grid.appendChild(b);
    });
  }
}

function resetProgress() {
  if(confirm('全ての学習進捗をリセットしますか？')) {
    state.learned = {};
    state.quizStats = {correct:0,wrong:0,total:0};
    saveState();
    updateProgress();
    showToast('リセットしました');
  }
}

// ===== PWA MANIFEST =====
function injectManifest() {
  const manifest = {
    name:"日常英会話 単語学習",
    short_name:"英単語",
    description:"日常英会話の単語を楽しく学ぼう",
    start_url:"./",
    display:"standalone",
    background_color:"#F8FAFC",
    theme_color:"#4F46E5",
    orientation:"portrait",
    icons:[
      {src:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234F46E5'/><text y='.9em' font-size='80' x='10'>📖</text></svg>",sizes:"any",type:"image/svg+xml"}
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('link');
  link.rel='manifest'; link.href=url;
  document.head.appendChild(link);
  document.getElementById('manifest-placeholder').remove();
}

// ===== SERVICE WORKER =====
function registerSW() {
  if('serviceWorker' in navigator) {
    const swCode = `
const CACHE='ev-app-v1';
const ASSETS=['./'];
self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS))));
self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{const clone=res.clone();caches.open(CACHE).then(c=>c.put(e.request,clone));return res;}))));
self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k))))));
`;
    const blob = new Blob([swCode], {type:'application/javascript'});
    const url = URL.createObjectURL(blob);
    navigator.serviceWorker.register(url).catch(()=>{});
  }
}

// ===== INIT =====
loadState();
injectManifest();
registerSW();
showPage('home');
</script>
